name: WEB3 checks

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

jobs:
  assignment-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-1-oo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assignments/assignment-1-oo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:supplied
      - run: npm test

  assignment-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-2-vue-bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  assignment-3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-3-vue-graphql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  assignment-4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-4-functional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  assignment-5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-5-react-redux-rxjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  assignment-6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/assignment-6-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test production start
        run: |
          npm start > /tmp/a6-start.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null && \
               curl -fsS -H 'content-type: application/json' -d '{"query":"{ __typename }"}' http://127.0.0.1:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a6-start.log
          exit 1
