name: A4 inspect

on:
  push:
    branches:
      - chatgpt/assignment-4

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assignment-4
      - name: Stage supplied functional tests
        run: |
          rm -rf /tmp/functional-test
          mkdir -p /tmp/functional-test
          unzip -q 'reference/tests/functional-test.zip' -d /tmp/functional-test
          mkdir -p assignments/assignment-4-functional
          cp -R /tmp/functional-test/. assignments/assignment-4-functional/
      - name: Commit supplied tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assignments/assignment-4-functional
          if ! git diff --cached --quiet; then
            git commit -m 'test: add supplied assignment 4 functional suite'
            git push origin HEAD:chatgpt/assignment-4
          fi
