name: A4 inspect

on:
  push:
    branches:
      - chatgpt/assignment-4

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assignment-4
      - name: Flatten supplied functional harness
        run: |
          rm -rf /tmp/a4-functional
          mkdir -p /tmp/a4-functional
          unzip -q 'reference/tests/functional-test.zip' -d /tmp/a4-functional
          rm -rf assignments/assignment-4-functional/functional-test
          cp -R /tmp/a4-functional/functional-test/. assignments/assignment-4-functional/
      - name: Commit supplied harness
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assignments/assignment-4-functional
          if ! git diff --cached --quiet; then
            git commit -m 'test: flatten supplied assignment 4 harness'
            git push origin HEAD:chatgpt/assignment-4
          fi
